<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>璇界AI - 管理后台支付与发票设计</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-app="admin">
  <div class="app">
    <header class="topbar">
      <div class="brand"><b class="brand-mark">◆</b><span>璇界AI - Token网关平台</span></div>
      <nav class="topnav"><a href="#">首页</a><a href="#">控制台</a><a href="#">模型广场</a><a href="#">文档</a></nav>
      <div class="top-actions"><button class="icon-btn"><i data-lucide="bell"></i></button><button class="icon-btn"><i data-lucide="monitor"></i></button><button class="icon-btn"><i data-lucide="languages"></i></button><button class="avatar"><i>管</i>管理员 <span>⌄</span></button></div>
    </header>
    <aside class="sidebar">
      <div class="nav-section"><div class="nav-label">聊天</div><button class="nav-item"><i data-lucide="message-square"></i>文本对话</button></div>
      <div class="nav-section"><div class="nav-label">控制台</div><button class="nav-item"><i data-lucide="layout-grid"></i>概览</button><button class="nav-item"><i data-lucide="key-round"></i>API密钥</button><button class="nav-item"><i data-lucide="chart-no-axes-column-increasing"></i>使用记录</button><button class="nav-item"><i data-lucide="square-check-big"></i>视频任务</button></div>
      <div class="nav-section"><div class="nav-label">个人中心</div><button class="nav-item"><i data-lucide="wallet-cards"></i>兑换&钱包管理</button><button class="nav-item"><i data-lucide="user-round"></i>个人设置</button></div>
      <div class="nav-section"><div class="nav-label">财务管理</div><button class="nav-item" data-route="orders"><i data-lucide="receipt"></i>充值订单</button><button class="nav-item active" data-route="invoices"><i data-lucide="file-check-2"></i>开票申请</button><button class="nav-item" data-route="audit"><i data-lucide="scroll-text"></i>操作记录</button></div>
      <button class="sidebar-collapse">‹　收起侧边栏</button>
    </aside>
    <main class="content" id="app-content"></main>
  </div>

  <div class="drawer-layer" id="detail-drawer"><div class="mask" data-close="detail-drawer"></div><aside class="drawer"><header class="drawer-head"><div class="drawer-title" id="drawer-title">详情</div><button class="close" data-close="detail-drawer"><i data-lucide="x"></i></button></header><div class="drawer-body" id="drawer-body"></div><footer class="drawer-foot" id="drawer-foot"><button class="btn btn-plain" data-close="detail-drawer">关闭</button></footer></aside></div>

  <div class="modal-layer" id="action-modal"><div class="mask" data-close="action-modal"></div><section class="modal"><header class="modal-head"><div class="modal-title" id="action-title">操作确认</div><button class="close" data-close="action-modal"><i data-lucide="x"></i></button></header><div class="modal-body" id="action-body"></div><footer class="modal-foot"><button class="btn btn-plain" data-close="action-modal">取消</button><button class="btn btn-primary" id="action-confirm">确认</button></footer></section></div>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="invoice-domain.js"></script>
  <script src="admin.js"></script>
</body>
</html>
